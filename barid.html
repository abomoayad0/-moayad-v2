<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · بريد المدرسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · بريد المدرسة</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="dayView" class="wrap" hidden>
  <div class="day">
    <div class="full" id="schoolBox">
      <label for="school">المدرسة</label>
      <select id="school"></select>
    </div>
    <div class="full" hidden><input id="date" type="date"></div>
  </div>

  <p class="role" id="roleLine" hidden><i class="dot"></i><span id="roleText"></span></p>
  <div class="flash" id="flash" hidden></div>
  <div class="notice err" id="loadErr" hidden></div>

  <div class="rs-pick" id="tabs" role="tablist" aria-label="أبوابُ البريد"></div>

  <!-- ① ما ينتظر الصادر — صدرُ البريد (v2_outgoing_pending) بترتيب العمل -->
  <section id="pendView">
    <section class="rs-card">
      <h3>ما ينتظر الصادر</h3>
      <p class="rs-sum" id="pSum"></p>
      <div id="pBody"></div>
      <p class="rs-meta" id="pNote"></p>
    </section>
  </section>

  <!-- ⑥ السجلّ (v2_outgoing_register) -->
  <section id="regView" hidden>
    <section class="rs-card">
      <h3>سجلُّ الصادر</h3>
      <div class="rs-label">الحال</div>
      <div class="rs-pick" id="rStatus"></div>
      <div class="rs-label">المدّة</div>
      <div class="rs-pick" id="rDays"></div>
      <p class="rs-sum" id="rSum"></p>
      <div id="rBody"></div>
      <p class="rs-meta" id="rNote"></p>
    </section>
  </section>

  <!-- ⑧ الوارد (v2_mail_inbox · v2_mail_card · v2_mail_my_tasks) -->
  <section id="inView" hidden>
    <section class="rs-card">
      <h3>ما وُجّه إليّ من الوارد</h3>
      <div id="iMine"></div>
    </section>
    <section class="rs-card">
      <h3>الوارد</h3>
      <div id="iBody"></div>
    </section>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="views.js"></script>
<script src="barid.js"></script>
</body>
</html>
