<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · لوحة التحكّم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · لوحة التحكّم</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="panelView" class="wrap" hidden>
  <div class="notice err" id="loadErr" hidden></div>
  <p class="hint">كلّ بابٍ كما أرجعته القاعدة: المقفلُ 🔒 يُقرأ ومعه سببُه وسندُه، والمفتوحُ ✅ يُعدَّل.</p>
  <div id="groups"></div>
</main>

<dialog id="quorumDlg"><form method="dialog">
  <h3>قواعد اللجنة</h3>
  <p class="quote" id="qWhat"></p>
  <p class="hint" id="qNow"></p>
  <label for="qMin">النصاب: أقلّ عددٍ من الرادّين (حاضرًا أو عن بُعد)</label>
  <input id="qMin" type="number" min="2" inputmode="numeric">
  <label class="chk"><input id="qClear" type="checkbox"> ألغِ النصاب</label>
  <label for="qRemote">الردُّ عن بُعد</label>
  <select id="qRemote"><option value="yes">مقبول</option><option value="no">غيرُ مقبول</option></select>
  <label for="qTie">حكمُ التعادل</label>
  <select id="qTie"><option value="رئيس">يُرجَّح جانبُ الرئيس</option><option value="تأجيل">يُؤجَّل البند</option></select>
  <label for="qNote">ملاحظة</label>
  <textarea id="qNote" rows="3"></textarea>
  <p class="hint">اجتهادُ مدرسةٍ لا نصَّ له في الدليل التنظيميّ.</p>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">احفظ القواعد</button>
  </div>
</form></dialog>

<dialog id="seatDlg"><form method="dialog">
  <h3>سعة المقعد المنتخَب</h3>
  <p class="quote" id="sWhat"></p>
  <label for="sCount">السعة الجديدة</label>
  <input id="sCount" type="number" min="0" inputmode="numeric">
  <label for="sReason">السبب — إلزامي</label>
  <textarea id="sReason" rows="3"></textarea>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept" id="sOk" disabled>احفظ السعة</button>
  </div>
</form></dialog>

<dialog id="practiceDlg"><form method="dialog">
  <h3>ممارسة الصفّ</h3>
  <p class="quote" id="pcWhat"></p>
  <label for="pcTitle">نصّ الممارسة</label>
  <input id="pcTitle" type="text">
  <label for="pcPolarity">النوع</label>
  <select id="pcPolarity"><option value="positive">إيجابيّة</option><option value="negative">سلبيّة</option></select>
  <label for="pcScope">المجال</label>
  <select id="pcScope"></select>
  <label for="pcKind">الصنف</label>
  <select id="pcKind"><option value="practice">ممارسة</option><option value="state">حالة</option></select>
  <label for="pcPoints">النقاط</label>
  <input id="pcPoints" type="number" step="0.25" inputmode="decimal">
  <label for="pcZone">الموضع</label>
  <input id="pcZone" type="text">
  <label class="chk"><input id="pcOnce" type="checkbox"> مرّةً واحدةً في اليوم</label>
  <label for="pcThrCount">الحدّ: عدد المرّات</label>
  <input id="pcThrCount" type="number" min="0" inputmode="numeric">
  <label for="pcThrDays">خلال أيّام</label>
  <input id="pcThrDays" type="number" min="0" inputmode="numeric">
  <label for="pcEsc">تُصعَّد إلى المخالفة رقم</label>
  <input id="pcEsc" type="number" min="1" inputmode="numeric">
  <label for="pcEscNote">ملاحظة التصعيد</label>
  <textarea id="pcEscNote" rows="2"></textarea>
  <label for="pcNote">ملاحظة</label>
  <textarea id="pcNote" rows="2"></textarea>
  <label for="pcOrd">الترتيب</label>
  <input id="pcOrd" type="number" min="0" inputmode="numeric">
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">احفظ</button>
  </div>
</form></dialog>

<dialog id="scopeDlg"><form method="dialog">
  <h3>مجال الممارسة</h3>
  <p class="quote" id="scWhat"></p>
  <label for="scLabel">اسم المجال</label>
  <input id="scLabel" type="text">
  <label for="scOrd">الترتيب</label>
  <input id="scOrd" type="number" min="0" inputmode="numeric">
  <label class="chk"><input id="scActive" type="checkbox" checked> نافذ</label>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">احفظ المجال</button>
  </div>
</form></dialog>

<dialog id="staffDlg"><form method="dialog">
  <h3>منسوب</h3>
  <p class="quote" id="stWhat"></p>
  <label for="stName">الاسمُ كاملًا</label><input id="stName" type="text">
  <label for="stNid">رقمُ الهويّة (عشرةُ أرقام)</label><input id="stNid" type="text" inputmode="numeric" maxlength="10">
  <label for="stEmp">الرقمُ الوظيفيّ</label><input id="stEmp" type="text">
  <label for="stPhone">الجوّال</label><input id="stPhone" type="text" inputmode="tel">
  <label for="stEmail">البريد</label><input id="stEmail" type="text" inputmode="email">
  <label for="stMajor">التخصّص</label><input id="stMajor" type="text">
  <label for="stRank">الرتبة</label><input id="stRank" type="text">
  <label for="stQual">المؤهّل</label><input id="stQual" type="text">
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">احفظ</button>
  </div>
</form></dialog>

<dialog id="assignDlg"><form method="dialog">
  <h3>إسنادُ تكليف</h3>
  <p class="quote" id="asWhat"></p>
  <label for="asPost">الوظيفةُ في الملاك</label><select id="asPost"></select>
  <label for="asLetter">رقمُ الخطاب — واكتب «بلا رقم» إن لم يكن له رقم</label><input id="asLetter" type="text" required>
  <label for="asLetterDate">تاريخُ الخطاب</label><input id="asLetterDate" type="date" required>
  <label for="asStart">يبدأ في (فارغٌ = اليوم)</label><input id="asStart" type="date">
  <label class="chk"><input id="asEntitled" type="checkbox" checked> مستحقّ</label>
  <label for="asReason">ملاحظة</label><textarea id="asReason" rows="2"></textarea>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost" formnovalidate>تراجع</button>
    <button value="ok" type="submit" class="btn-accept">أسنِد</button>
  </div>
</form></dialog>

<dialog id="assignEndDlg"><form method="dialog">
  <h3>إنهاءُ تكليف</h3>
  <p class="quote" id="aeWhat"></p>
  <label for="aeReason">السبب</label><select id="aeReason"></select>
  <label for="aeDate">تاريخُ الإنهاء (فارغٌ = اليوم)</label><input id="aeDate" type="date">
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">أنهِ التكليف</button>
  </div>
</form></dialog>

<dialog id="studentDlg"><form method="dialog">
  <h3>طالب</h3>
  <p class="quote" id="suWhat"></p>
  <label for="suName">الاسمُ كاملًا</label><input id="suName" type="text">
  <label for="suNo">رقمُ الطالب في نور (تسعةُ أرقام)</label><input id="suNo" type="text" inputmode="numeric" maxlength="9">
  <label for="suNid">رقمُ الهويّة (عشرةُ أرقام)</label><input id="suNid" type="text" inputmode="numeric" maxlength="10">
  <label for="suNat">الجنسيّة</label><input id="suNat" type="text">
  <label for="suBirth">تاريخُ الميلاد (هجريّ)</label><input id="suBirth" type="text">
  <label for="suSex">الجنس</label><select id="suSex"><option value=""></option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select>
  <label for="suPhone">جوّالُ الطالب</label><input id="suPhone" type="text" inputmode="tel">
  <label for="suGrade">الصفّ</label><input id="suGrade" type="number" min="1" max="12" inputmode="numeric" required>
  <label for="suSection">الشعبة</label><input id="suSection" type="text" required>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost" formnovalidate>تراجع</button>
    <button value="ok" type="submit" class="btn-accept">احفظ</button>
  </div>
</form></dialog>

<dialog id="enrolEndDlg"><form method="dialog">
  <h3>إنهاءُ قيد</h3>
  <p class="quote" id="eeWhat"></p>
  <label for="eeReason">السبب</label><select id="eeReason"></select>
  <label for="eeNote">نصُّ السبب — إلزاميٌّ مع «أخرى»</label><textarea id="eeNote" rows="2"></textarea>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">أنهِ القيد</button>
  </div>
</form></dialog>

<dialog id="guardianDlg"><form method="dialog">
  <h3>وليُّ أمر</h3>
  <p class="quote" id="gdWhat"></p>
  <label for="gdName">الاسمُ كاملًا</label><input id="gdName" type="text">
  <label for="gdRel">صلتُه بالطالب</label><input id="gdRel" type="text">
  <label for="gdNid">رقمُ الهويّة (عشرةُ أرقام)</label><input id="gdNid" type="text" inputmode="numeric" maxlength="10">
  <label for="gdPhone">الجوّال</label><input id="gdPhone" type="text" inputmode="tel">
  <label for="gdWork">هاتفُ العمل</label><input id="gdWork" type="text" inputmode="tel">
  <label for="gdHome">هاتفُ المنزل</label><input id="gdHome" type="text" inputmode="tel">
  <label for="gdPlace">جهةُ العمل</label><input id="gdPlace" type="text">
  <label class="chk"><input id="gdPrimary" type="checkbox"> الوليُّ الأساسيّ</label>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">احفظ</button>
  </div>
</form></dialog>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="panel.js"></script>
</body>
</html>
