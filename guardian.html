<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · بوّابة وليّ الأمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · بوّابة وليّ الأمر</h1>
    <div class="who" id="gWho"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<div class="gatebox"><div class="notice err" id="loadErr" hidden></div></div>

<main id="gView" class="wrap" hidden>
  <div id="kids"></div>
  <h3 class="grp" id="formsTitle">نماذج تنتظرك</h3>
  <div id="forms"></div>
</main>

<dialog id="refuseDlg"><form method="dialog">
  <h3>الامتناع عن التوقيع</h3>
  <p class="quote" id="refWhat"></p>
  <label for="refReason">سبب الامتناع — إلزامي</label>
  <textarea id="refReason" rows="3"></textarea>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-danger" id="refOk" disabled>سجّل الامتناع</button>
  </div>
</form></dialog>

<dialog id="replyDlg"><form method="dialog">
  <h3>ردّك على النموذج</h3>
  <p class="quote" id="repWhat"></p>
  <label for="repNote">ملاحظة (اختيارية)</label>
  <textarea id="repNote" rows="3"></textarea>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept">أرسل الردّ</button>
  </div>
</form></dialog>

<dialog id="noteDlg"><form method="dialog">
  <h3>رأيك في النموذج</h3>
  <p class="quote" id="noteWhat"></p>
  <label for="noteText">اكتب رأيك</label>
  <textarea id="noteText" rows="4"></textarea>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept" id="noteOk" disabled>أرسل رأيك</button>
  </div>
</form></dialog>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="guardian.js"></script>
</body>
</html>
