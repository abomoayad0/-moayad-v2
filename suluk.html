<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · رصد المخالفات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · رصد المخالفات</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="dayView" class="wrap" hidden>
  <div class="day">
    <div class="full" id="schoolBox">
      <label for="school">المدرسة</label>
      <select id="school"></select>
    </div>
    <!-- الرصد بتاريخ اليوم في القاعدة — فلا يُختار يوم هنا -->
    <div class="full" hidden><input id="date" type="date"></div>
    <div class="full"><div class="dates" id="dates"></div></div>
  </div>

  <div class="notice err" id="loadErr" hidden></div>

  <!-- ١ · ارصد مخالفة — ضغطةٌ واحدة، ولا نافذةَ تعترض -->
  <section class="rs-card" id="recCard">
    <div class="rs-flash" id="flash" hidden></div>
    <h3>ارصد مخالفة</h3>
    <p class="rs-meta">كلُّ سلوكٍ ملفٌّ مستقلٌّ بسلّمه</p>
    <label for="cls">الفصل</label>
    <select id="cls"></select>
    <label for="stu">الطالب</label>
    <select id="stu" disabled></select>
    <label for="qProb">السلوك</label>
    <input id="qProb" type="search" placeholder="ابحث في نصّ السلوك" aria-label="بحث في السلوكيّات" disabled>
    <select id="prob" disabled></select>
    <div id="periodBox" hidden>
      <div class="rs-label">الحصّة</div>
      <div class="rs-pick" id="periods" role="group" aria-label="الحصّة"></div>
    </div>
    <div class="rs-note">مداخلُ متعدّدةٌ ومخرجٌ واحد — <b>وأوّلُ من يدوّن يُقفل البابَ على الباقين</b>، ويُحفظ من دوّن وبأيّ صفة</div>
    <button type="button" class="rs-btn big" id="rec" disabled>ارصد</button>
  </section>

  <!-- ٢ · ملفّاتُ الطالب — لكلّ سلوكٍ بطاقتُه -->
  <section id="files"></section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="tasks.js"></script>
<script src="suluk.js"></script>
</body>
</html>
