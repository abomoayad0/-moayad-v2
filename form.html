<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · نموذج للطبع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* صفحة النموذج — تُطبع على A4، وخانات التوقيع فارغة تُوقَّع يدوياً */
  body { background: #e9edef; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; justify-content: space-between; align-items: center;
         background: var(--navy); color: #fff; padding: 10px 16px; }
  .bar button { background: #fff; color: var(--navy); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 700; min-height: 40px; }
  .sheet { background: #fff; color: #111; max-width: 794px; margin: 16px auto; padding: 28px 32px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .sheet h1 { text-align: center; font-size: 22px; margin: 6px 0 4px; }
  .sheet .sch { text-align: center; font-weight: 700; }
  .sheet .src { text-align: center; font-size: 12px; color: #555; margin-bottom: 14px; }
  .sheet table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  .sheet th, .sheet td { border: 1px solid #333; padding: 6px 8px; vertical-align: top; text-align: start; }
  .sheet th { background: #f1f4f5; width: 30%; font-weight: 700; }
  .sheet table.grid th { width: auto; text-align: center; }
  .sheet table.grid td { height: 30px; }
  .sheet h2 { font-size: 15px; margin: 16px 0 4px; }
  .sheet .blank { color: #999; }
  .signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
  .signs div { text-align: center; font-size: 14px; }
  .signs .line { border-bottom: 1px solid #333; height: 44px; margin-bottom: 6px; }
  .dt { text-align: start; font-size: 13px; margin-top: 8px; }
  @media print {
    body { background: #fff; }
    .bar, .toast, #loadErr { display: none !important; }
    .sheet { box-shadow: none; margin: 0; max-width: none; padding: 0; }
    @page { size: A4; margin: 14mm; }
  }
  @media (max-width: 600px) { .sheet { padding: 16px; margin: 8px; } .signs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <span id="barTitle">نموذج للطبع</span>
  <button type="button" id="printBtn">اطبع</button>
</div>
<div class="gatebox"><div class="notice err" id="loadErr" hidden></div></div>
<article class="sheet" id="sheet" hidden></article>
<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="form.js"></script>
</body>
</html>
