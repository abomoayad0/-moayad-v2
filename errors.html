<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · لوحة الأخطاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · لوحة الأخطاء</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="dayView" class="wrap" hidden>
  <!-- المدرسة واليوم لا تحكم هذه اللوحة — تبقى مخفية لأن المشترك يحتاجها -->
  <div hidden><div id="schoolBox"><select id="school"></select></div><input id="date" type="date"><div id="dates"></div></div>
  <div class="notice err" id="loadErr" hidden></div>

  <p class="hint"><b>عطب</b> (error): يُصلَح · <b>حارس</b> (guard): رفضٌ عمل كما يجب، فلا يُصلَح.</p>
  <div class="filters" id="fDays" role="group" aria-label="المدة">
    <button type="button" data-d="1" aria-pressed="false">اليوم</button>
    <button type="button" data-d="7" aria-pressed="true">أسبوع</button>
    <button type="button" data-d="30" aria-pressed="false">شهر</button>
  </div>
  <div class="filters" id="fKind" role="group" aria-label="النوع">
    <button type="button" data-k="" aria-pressed="true">الكل</button>
    <button type="button" data-k="error" aria-pressed="false">أعطاب</button>
    <button type="button" data-k="guard" aria-pressed="false">حرّاس</button>
  </div>
  <h3 class="grp" id="errTitle"></h3>
  <div id="errs"></div>
</main>

<dialog id="fixDlg">
  <form method="dialog">
    <h3>وُسم الخطأ: أُصلح</h3>
    <p class="quote" id="fixMsg"></p>
    <label for="fixNote">ما الذي أُصلح (اختياري)</label>
    <textarea id="fixNote" rows="3"></textarea>
    <div class="dlg-acts">
      <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
      <button value="ok" type="submit" class="btn-accept">أُصلح</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="errors.js"></script>
</body>
</html>
