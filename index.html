<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button" hidden>خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>

<!-- الدخول — رابط واحد للجميع -->
<section id="loginView" class="login" hidden>
  <h2>الدخول</h2>
  <p>تُفتح لك الشاشات التي يملكها تكليفك.</p>
  <form id="loginForm">
    <label for="email">البريد</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn-main" id="loginBtn" type="submit">دخول</button>
  </form>
  <div class="notice err" id="loginErr" hidden></div>
</section>

<!-- القائمة — لمن يملك أكثر من شاشة -->
<main id="menuView" class="wrap" hidden>
  <div class="notice err" id="gateErr" hidden></div>
  <section class="panel" id="meBox" hidden>
    <h2 class="ph">تكاليفك النافذة</h2>
    <div id="assignments"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="entry.js"></script>
</body>
</html>
