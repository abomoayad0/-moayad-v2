<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · صفحة الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · صفحة الطالب</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="sView" class="wrap" hidden>
  <p class="role" id="roleLine"><i class="dot"></i><span id="roleText"></span></p>
  <div class="rs-note" id="previewNote" hidden></div>
  <div class="flash" id="flash" hidden></div>
  <div class="notice err" id="loadErr" hidden></div>

  <!-- ① درجةُ سلوكي -->
  <!-- صندوقُ النماذج: ما وُجّه إليّ وحدي (v2_my_form_inbox) — وعنوانُه who_ar -->
  <section class="rs-card" id="inboxCard" hidden>
    <h3 id="inboxTitle">صندوقُ النماذج</h3>
    <div id="inbox"></div>
  </section>

  <section class="rs-card">
    <h3>درجةُ سلوكي</h3>
    <div id="score"></div>
  </section>

  <!-- ④ فرصٌ سجّلتُ فيها -->
  <section class="rs-card">
    <h3>فرصٌ سجّلتُ فيها</h3>
    <div id="mine"></div>
  </section>

  <!-- ⑤ الفرصُ المتاحة الآن -->
  <section class="rs-card">
    <h3>الفرصُ المتاحة الآن</h3>
    <p class="rs-meta">والاختيارُ لك — فالتعويضُ حقٌّ لا تكليف</p>
    <div id="open"></div>
  </section>

  <!-- ⑦ شواهدي -->
  <section class="rs-card">
    <h3>شواهدي</h3>
    <div id="evid"></div>
  </section>

  <!-- ملفّاتي — من سجلّي بصفة الطالب -->
  <!-- خطّةُ تعديل سلوكي كما ترجع من v2_plan_of — للقراءة -->
  <section class="rs-card" id="planCard" hidden>
    <h3>خطّةُ تعديل سلوكي</h3>
    <div id="plans"></div>
  </section>

  <section class="rs-card">
    <h3>رصداتي</h3>
    <div id="recs"></div>
  </section>

  <div id="offCards"></div>
</main>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="views.js"></script>
<script src="talib.js"></script>
</body>
</html>
