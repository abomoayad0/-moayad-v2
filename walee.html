<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · بوّابة وليّ الأمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · بوّابة وليّ الأمر</h1>
    <div class="who" id="gWho"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="gView" class="wrap" hidden>
  <!-- رأسُ الشاشة -->
  <p class="role" id="roleLine"><i class="dot"></i><span id="roleText"></span></p>
  <div class="flash" id="flash" hidden></div>
  <div class="notice err" id="loadErr" hidden></div>

  <!-- الأبناءُ شرائط حين يكونون أكثرَ من واحد -->
  <div class="rs-pick" id="kids" role="group" aria-label="الابن" hidden></div>

  <!-- ① بطاقةُ الابن -->
  <section class="rs-card" id="kidCard">
    <h3 id="kidName"></h3>
    <p class="rs-meta" id="kidMeta"></p>
    <div id="attend"></div>
    <div id="score"></div>
  </section>

  <!-- ② رصداتُ ابني -->
  <section class="rs-card">
    <h3>رصداتُ ابني</h3>
    <p class="rs-meta">تظهر لك من أوّل رصدة</p>
    <div id="recs"></div>
  </section>

  <!-- ③ ما فعلته المدرسة -->
  <section class="rs-card">
    <h3>ما فعلته المدرسة</h3>
    <p class="rs-meta">كلُّ إجراءٍ اتُّخذ مع ابنك بتاريخه</p>
    <details class="rs-dt" id="tlBox">
      <summary id="tlSum">السجلّ</summary>
      <div class="rs-dtb" id="timeline"></div>
    </details>
  </section>

  <!-- ④ سلوكٌ متميّزٌ لابني -->
  <section class="rs-card">
    <h3>سلوكٌ متميّزٌ لابني</h3>
    <div id="merit"></div>
  </section>

  <!-- ⑥ ⑧ نماذج تنتظرك: دُوّنت على ابنك ويوقّع · خطابُ دعوة ويردّ -->
  <section class="rs-card">
    <h3 id="formsTitle">نماذج تنتظرك</h3>
    <p class="rs-meta">ما اعتمدته المدرسةُ ووصل إليك — توقّعه أو تردّ عليه</p>
    <div id="forms"></div>
  </section>

  <div id="offCards"></div>
</main>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="views.js"></script>
<script src="walee.js"></script>
</body>
</html>
