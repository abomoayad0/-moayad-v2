<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · التحصيل الدراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · التحصيل الدراسي</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="dayView" class="wrap" hidden>
  <div class="day">
    <div class="full" id="schoolBox">
      <label for="school">المدرسة</label>
      <select id="school"></select>
    </div>
    <div class="full" hidden><input id="date" type="date"></div>
  </div>

  <p class="role" id="roleLine" hidden><i class="dot"></i><span id="roleText"></span></p>
  <div class="flash" id="flash" hidden></div>
  <div class="notice err" id="loadErr" hidden></div>

  <!-- ① ما يُنتظر منّي — للوكيل التعليميّ: v2_card_my_steps ⇒ v2_card_step_do -->
  <section class="rs-card" id="stepsCard" hidden>
    <h3>ما يُنتظر منّي</h3>
    <p class="rs-meta" id="stepsSum"></p>
    <div id="steps"></div>
  </section>

  <!-- ② لوحةُ المتدنّين — v2_low_board · والإشعار v2_low_notify_window ⇒ v2_low_notify_run · والإحالة v2_remedial_refer -->
  <section class="rs-card" id="lowCard" hidden>
    <h3>لوحةُ المتدنّين</h3>
    <div id="low"></div>
  </section>

  <!-- ③ تحليلُ نتائج الفترة — v2_term_analysis -->
  <section class="rs-card" id="taCard">
    <h3>تحليلُ نتائجِ الفترة</h3>
    <div id="ta"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="views.js"></script>
<script src="ihala.js"></script>
<script src="tahsil.js"></script>
</body>
</html>
