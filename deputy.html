<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · قرارات الوكيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · قرارات الوكيل</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="dayView" class="wrap" hidden>
  <div class="day">
    <div class="full" id="schoolBox">
      <label for="school">المدرسة</label>
      <select id="school"></select>
    </div>
    <div class="full">
      <label for="date">اليوم</label>
      <input id="date" type="date">
      <div class="dates" id="dates"></div>
    </div>
  </div>

  <p class="role" id="roleLine" hidden><i class="dot"></i><span id="roleText"></span></p>
  <div class="flash" id="flash" hidden></div>
  <div class="notice err" id="loadErr" hidden></div>
  <div class="notice nostudy" id="noStudy" hidden></div>

  <!-- ① اليومُ وإقفالُه — يرى ويقرّر ولا يرصد -->
  <section class="rs-card" id="dayCard" hidden>
    <div class="rs-hd"><h3>اليوم</h3><span class="rs-occ" id="dayStatus"></span></div>
    <p class="rs-meta" id="unrecLine"></p>
    <div class="rs-lgd" id="counts"></div>
    <div id="openClasses"></div>
    <p class="rs-note" id="closeHint"></p>
    <div class="rs-row" id="dayActs"></div>
    <p class="rs-meta nocan" id="noCanDay" hidden></p>
    <div id="closeResult" hidden></div>
  </section>

  <!-- ما وقع بعد الإقفال -->
  <section class="rs-card" id="logCard" hidden>
    <h3>ما وقع بعد الإقفال</h3>
    <div id="log"></div>
  </section>

  <!-- ② الأعذارُ المنتظرة -->
  <section class="rs-card" id="excuseCard" hidden>
    <div class="rs-hd"><h3>الأعذارُ المنتظرة</h3><span class="rs-occ" id="excuseCount"></span></div>
    <div id="excuses"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="views.js"></script>
<script src="deputy.js"></script>
</body>
</html>
