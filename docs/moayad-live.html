<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد — جرّب الرصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f6f7f8;--card:#fff;--ink:#15445a;--mute:#6b7a83;--line:#e3e8ea;
 --brand:#07a869;--warn:#b8860b;--bad:#c0392b;--soft:#f0f4f3;--chip:#eef2f4;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1417;--card:#161d21;--ink:#e8eef1;--mute:#93a3ac;--line:#242e34;
 --soft:#17251f;--chip:#1b2429;}}
:root[data-theme="dark"]{--bg:#0f1417;--card:#161d21;--ink:#e8eef1;--mute:#93a3ac;
 --line:#242e34;--soft:#17251f;--chip:#1b2429;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.75;
 -webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);
 padding-top:12px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 2px;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mute);
 font-family:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .n{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:999px;
 background:var(--bad);color:#fff;font-size:10px;margin-inline-start:5px;padding:0 4px}
nav .n[hidden]{display:none}
.role{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-size:12.5px;color:var(--mute)}
.role b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:0 0 auto}
section{display:none}section.on{display:block;animation:f .18s ease}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700}
.meta{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--mute);font-weight:500}
.chip.g{background:var(--soft);color:var(--brand)}
.chip.w{background:#fdf4e3;color:var(--warn)}
.chip.r{background:#fdeeec;color:var(--bad)}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .chip.w{background:#2a2213}
 :root:not([data-theme="light"]) .chip.r{background:#2a1715}}
.step{border-right:3px solid var(--line);padding:2px 12px 2px 0;margin:13px 0}
.step.now{border-color:var(--brand)}.step.done{border-color:var(--chip);opacity:.78}
.step.soon{opacity:.42}
.step h4{margin:0 0 2px;font-size:13.5px;font-weight:700}
.step p{margin:0;font-size:12.5px;color:var(--mute)}
ul.acts{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.acts li{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--bg);
 border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tick{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
 font-size:10px;font-weight:700;background:var(--chip);color:var(--mute)}
.tick.ok{background:var(--brand);color:#fff}
.tick.no{background:transparent;border:1.5px dashed var(--line)}
li .who{margin-inline-start:auto;font-size:11px;color:var(--mute);white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-family:inherit;
 font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.soft{background:var(--chip);border-color:var(--line);color:var(--ink)}
.btn.big{width:100%;padding:12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
select,textarea,input[type=text],input[type=number]{width:100%;font-family:inherit;font-size:13.5px;
 padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
 color:var(--ink);margin-top:6px}
textarea{min-height:60px;resize:vertical}
input[type=file]{width:100%;font-family:inherit;font-size:12.5px;padding:9px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--mute);margin-top:6px}
label{font-size:12.5px;color:var(--mute);font-weight:600;display:block;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--mute);width:42%;padding-inline-end:10px}
tr:last-child td{border-bottom:0}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--mute);margin-top:10px}
.note b{color:var(--ink)}
.flash{background:var(--soft);border:1px solid var(--brand);border-radius:10px;padding:10px 12px;
 font-size:13px;margin:10px 0;color:var(--ink)}
.bar{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin:6px 0 4px;display:flex}
.bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.bar i.m{background:var(--warn)}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:28px;font-weight:700;letter-spacing:-1px}
.score span{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);font-size:13px;text-align:center;padding:18px 0}
.file{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:var(--bg)}
.file.sel{border-color:var(--brand);background:var(--soft)}
.file.tap{cursor:pointer}
.file h5{margin:0 0 2px;font-size:13.5px;font-weight:700}
.file p{margin:0;font-size:12px;color:var(--mute)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pick span{border:1px solid var(--line);background:var(--bg);border-radius:999px;
 padding:5px 11px;font-size:12px;cursor:pointer;user-select:none}
.pick span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick.pos span.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pick.ico span{display:flex;flex-direction:column;align-items:center;gap:2px;
 width:88px;padding:9px 6px;border-radius:12px;font-size:10.5px;line-height:1.35;text-align:center}
.pick.ico span b{font-size:21px;font-weight:400;line-height:1.1}
.tip{background:var(--soft);border-radius:10px;padding:9px 11px;font-size:12.5px;
 color:var(--ink);margin-top:8px;min-height:38px}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
 width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;
 padding:0;margin-inline-start:7px;flex:0 0 auto;transition:.15s}
.ib:hover,.ib:focus{border-color:var(--brand);color:var(--brand)}
.ib svg{width:16px;height:16px;display:block}
.ib.lbl{width:auto;height:auto;padding:7px 12px;gap:7px;
 display:inline-flex;align-items:center;font-family:inherit;font-size:12.5px;font-weight:600;margin:0}
.tools{display:flex;gap:6px;flex:0 0 auto}
.dt{background:var(--soft);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:12.5px}
.dt.g{border-right:3px solid var(--brand)}
.dt summary{cursor:pointer;color:var(--mute);list-style:none}
.dt summary::-webkit-details-marker{display:none}
.dt summary::after{content:" ⌄";color:var(--mute)}
.dt[open] summary::after{content:" ⌃"}
.dt summary b{color:var(--ink)}
.dtb{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);color:var(--mute);line-height:1.9}
.dtb b{color:var(--ink)}
.addrow{display:flex;gap:7px;align-items:stretch;margin-top:6px}
.addrow input{margin-top:0;flex:1}
.addrow .btn{flex:0 0 auto;white-space:nowrap}
.bank{background:var(--soft);border-radius:11px;padding:9px 11px;margin-top:7px}
.bkh{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bkh b{color:var(--ink)}
.bkm{margin-inline-start:auto;border:1px solid var(--line);background:var(--card);
 color:var(--ink);font-family:inherit;font-size:11px;padding:3px 10px;border-radius:999px;cursor:pointer}
.bkl{display:flex;flex-direction:column;gap:5px}
.bkl span{background:var(--card);border:1px solid var(--line);border-radius:9px;
 padding:7px 10px;font-size:12px;line-height:1.7;cursor:pointer;transition:.15s}
.bkl span:hover{border-color:var(--brand)}
.lgd{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.lgd i{font-style:normal;background:var(--chip);border-radius:999px;padding:2px 9px;
 font-size:10.5px;color:var(--mute);white-space:nowrap}
.lgd i.p{background:var(--soft);color:var(--brand)}
.lgd i.k{background:transparent;padding:2px 0;color:var(--ink);font-weight:600}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hd h3{margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;
 align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;border-radius:16px 16px 0 0;
 padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 3px;font-size:16px}
footer{color:var(--mute);font-size:11.5px;text-align:center;margin-top:24px;line-height:1.9}
</style>
</head>

  <nav role="tablist">

<section id="m"></section>
<section id="c"></section>
<section id="a"></section>
<section id="k"></section>
<section id="s"></section>
<section id="g"></section>

</div>
<div class="modal" id="mod"><div class="sheet" id="sheet"></div></div>

function pick(key,pi){
  var b=BANK[key]; if(!b) return [];
  var out=[];
  if(b.p && pi!=null && b.p[pi]) out=out.concat(b.p[pi]);
  if(b.g) out=out.concat(b.g);
  return out;
}
function bankBox(key,target,pi,id){
  var a=pick(key,pi); if(!a.length) return "";
  var bid=id||("bk_"+key+"_"+Math.floor(Math.random()*9999));
  var h='<div class="bank" id="'+bid+'" data-t="'+target+'" data-k="'+key+'" data-p="'+(pi==null?'':pi)+'">'+
    '<div class="bkh"><b>بنكُ العبارات</b> — المسها فتُضاف · ولك أن تعدّل'+
    '<button class="bkm" data-more="'+bid+'">غيّرها</button></div><div class="bkl">';
  var idx=[]; while(idx.length<Math.min(4,a.length)){
    var r=Math.floor(Math.random()*a.length); if(idx.indexOf(r)<0) idx.push(r); }
  idx.forEach(function(r){ h+='<span data-v="'+esc(a[r])+'">'+esc(a[r])+'</span>'; });
  return h+'</div></div>';
}
function bindBanks(){
  document.querySelectorAll(".bank").forEach(function(bx){
    var t=document.getElementById(bx.getAttribute("data-t"));
    bx.querySelectorAll("span").forEach(function(sp){
      sp.onclick=function(){
        if(!t) return;
        var v=sp.getAttribute("data-v");
        t.value = t.value.trim() ? (t.value.trim()+" "+v) : v;
        sp.style.opacity=".45";
      };});
  });
  document.querySelectorAll("[data-more]").forEach(function(b){
    b.onclick=function(ev){ if(ev&&ev.preventDefault)ev.preventDefault();
      var bx=document.getElementById(b.getAttribute("data-more"));
      if(!bx) return;
      var key=bx.getAttribute("data-k"), pi=parseInt(bx.getAttribute("data-p"),10);
      var a=pick(key, isNaN(pi)?null:pi); if(!a.length) return;
      var lst=bx.querySelector(".bkl"); lst.innerHTML="";
      var idx=[]; while(idx.length<Math.min(4,a.length)){
        var r=Math.floor(Math.random()*a.length); if(idx.indexOf(r)<0) idx.push(r); }
      idx.forEach(function(r){
        var sp=document.createElement("span");
        sp.textContent=a[r]; sp.setAttribute("data-v",a[r]);
        lst.appendChild(sp); });
      bindBanks();
    };});
}

function sumRows(a){ return (a||[]).reduce(function(t,r){return t+(r.n||0);},0); }
function respond(f){
  if(!f||!f.plan||!f.plan.final) return {state:"no-plan"};
  var pre=f.recs.length, post=(f.after||0), auto=LOGGED[f.p];
  var dates=(f.extra||[]).map(function(x){return x.d;}).join(" · ");
  if(!auto && !f.teacherSaid) return {state:"ask-teacher",pre:pre,post:post,dates:dates};
  if(!auto) return {state: f.teacherSaid==="yes"?"failed":"improved", pre:pre,
    post: f.teacherSaid==="yes"?Math.max(1,post):0, by:"شهادةُ معلّم الفصل", dates:dates};
  return {state: post>0 ? "failed":"improved", pre:pre, post:post, dates:dates,
    by:(SRC[f.p]||"سجلٌّ يوميٌّ يُقفل")+" — فسكوتُه إثباتُ التزام"};
}

  o.log.push({d:extra&&extra.d?extra.d:"١٤٤٨/٥/٣", t:what, by:who,
    more:extra&&extra.more?extra.more:""});

function award(p,kind){
  var gotC=0,gotM=0;
  if(deducted()>0){ var room=Math.min(p, deducted()); S.pos+=room; gotC=room; p-=room; }
  if(p>0){ var room2=Math.min(p, 20-S.merit, 100-total()); room2=Math.max(0,room2);
    S.merit+=room2; gotM=room2; }
  return {comp:gotC,merit:gotM,total:gotC+gotM};
}

function record(pi){
  if(ABSENT_TODAY){
    flash("الطالبُ غائبٌ اليوم — فلا يُرصد عليه شيء");
    return;
  }
  var f=null,i;
  for(i=0;i<S.files.length;i++) if(S.files[i].p===pi) f=S.files[i];
  if(!f){ f={p:pi,recs:[],acts:{},survey:null,task:null,by:REC_BY,log:[]}; S.files.push(f); }
  cur=S.files.indexOf(f);
  if(f.recs.length>=4){
    if(!f.extra) f.extra=[];
    var dd=["١٤٤٨/٥/٦","١٤٤٨/٥/٩","١٤٤٨/٥/١٢","١٤٤٨/٥/١٣","١٤٤٨/٥/١٤"];
    var nd=dd[Math.min(f.extra.length,dd.length-1)];
    f.extra.push({d:nd,by:REC_BY});
    var after = (f.plan&&f.plan.final);
    if(after) f.after=(f.after||0)+1;
    LOG(f, after ? "تكرّر السلوكُ بعد اعتماد الخطّة · المرّةُ "+AR(f.after)
                 : "رُصد بلا حسم — بلغ السلّمُ منتهاه", REC_BY,"راصد",{d:nd});
    save(); render();
    flash(after?"رُصد بعد الخطّة — المرّةُ "+AR(f.after):"رُصد وقُيّد · ولا حسمَ بعد الرابعة");
    return; }
  var adv=ADVICE[pi]||[];
  f.recs.push({d:HD[f.recs.length], a:adv[Math.min(f.recs.length,adv.length-1)]||""});
  var L=LAD[f.recs.length-1];
  L.acts.forEach(function(a){ if(a.auto) f.acts[a.k]=true; });
  S.pos=Math.max(0,S.pos-L.d);
  LOG(f,"رُصدت المخالفة — "+PROBLEMS[pi]+" · الرصدةُ "+AR(f.recs.length),REC_BY,"راصد",
    {d:f.recs[f.recs.length-1].d});
  if(L.d>0) LOG(f,"حُسمت "+AR(L.d)+" درجة من السلوك الإيجابيّ","آليّ","النظام",
    {d:f.recs[f.recs.length-1].d});
  if(L.acts.some(function(a){return a.k==="comp"||a.k==="comp2";}))
    LOG(f,"فُتحت فرصةُ تعويضٍ للطالب","آليّ","النظام",{d:f.recs[f.recs.length-1].d});
  if(L.acts.some(function(a){return a.k==="refer";})){

      {d:f.recs[f.recs.length-1].d});
    if(!f.cs) f.cs={state:"open",opened:f.recs[f.recs.length-1].d,
      say:"",seen:"",factors:"",plan:"",filed:false};
  }
  if(L.acts.some(function(a){return a.k==="summon";}) && !f.summon){
    var days=workdaysAfter(f.recs[f.recs.length-1].d,5);
    var pick=days[2]||days[days.length-1]||{h:"١٤٤٨/٥/٥",d:"الثلاثاء"};
    f.summon={d:pick.h+" هـ — "+pick.d, t:"٩:٣٠ صباحًا",
      p:"مناقشةُ خطّة تعديل السلوك والاتّفاق عليها", reply:null, autoSent:true};
    LOG(f,"أُرسل خطابُ دعوة وليّ الأمر (١٠) آليًّا","آليّ","النظام",
      {d:f.recs[f.recs.length-1].d, more:f.summon.d+" · "+f.summon.t});
  }
  save(); render();
  flash("رُصدت «"+PROBLEMS[pi]+"» — الرصدةُ "+AR(f.recs.length));
}
function pending(f,who){ var out=[],st=step(f),i;
  for(i=1;i<=st;i++) (LAD[i-1].acts||[]).forEach(function(a){
    if(a.who===who && !f.acts[a.k]) out.push(a); });
  return out; }
function pendAll(who){ var n=0; S.files.forEach(function(f){ n+=pending(f,who).length; }); return n; }

var CAL=[

 {h:"١٤٤٨/٥/٥",d:"الثلاثاء",k:"study"},{h:"١٤٤٨/٥/٦",d:"الأربعاء",k:"holiday",why:"إجازةُ اليوم الوطنيّ"},
 {h:"١٤٤٨/٥/٧",d:"الخميس",k:"study"},  {h:"١٤٤٨/٥/٨",d:"الجمعة",k:"weekend"},
 {h:"١٤٤٨/٥/٩",d:"السبت",k:"weekend"}, {h:"١٤٤٨/٥/١٠",d:"الأحد",k:"study"},
 {h:"١٤٤٨/٥/١١",d:"الاثنين",k:"study"},{h:"١٤٤٨/٥/١٢",d:"الثلاثاء",k:"study"},
 {h:"١٤٤٨/٥/١٣",d:"الأربعاء",k:"study"},{h:"١٤٤٨/٥/١٤",d:"الخميس",k:"study"}];
function workdaysAfter(fromH,n){
  var i=0,out=[],start=-1;
  for(i=0;i<CAL.length;i++) if(fromH.indexOf(CAL[i].h)>=0){ start=i; break; }
  if(start<0) start=0;
  for(i=start+1;i<CAL.length && out.length<n;i++)
    if(CAL[i].k==="study") out.push(CAL[i]);
  return out;
}
function skipped(fromH,n){
  var i,start=-1,out=[],cnt=0;
  for(i=0;i<CAL.length;i++) if(fromH.indexOf(CAL[i].h)>=0){ start=i; break; }
  if(start<0) start=0;
  for(i=start+1;i<CAL.length && cnt<n;i++){
    if(CAL[i].k==="study"){ cnt++; }
    else out.push(CAL[i]);
  }
  return out;
}

function openOppPlan(oi){
  var o=S.opps[oi]; if(!o) return;
  var m=MERITS[o.mi];
  function draw(){
    var h='<h3>مخطّطُ الفرصة</h3>'+
      '<p class="meta">'+esc(m.t)+' · '+esc(o.when)+'</p>'+
      '<table><tr><td>الدرجةُ المقرّرة</td><td>'+AR(m.p)+' · ص١٩</td></tr>'+
      '<tr><td>السعة</td><td>'+AR(o.cap)+'</td></tr>'+
      '<tr><td>المشاركون</td><td>'+AR(o.members.length)+'</td></tr>'+
      '<tr><td>سببُ الإغلاق</td><td>'+esc(o.closeWhy||"—")+'</td></tr></table>'+
      '<div class="note">لا تُقدَّر درجةٌ لمن لم يشهد له رائدُ النشاط بالتنفيذ</div>';
    o.members.forEach(function(p,i){
      h+='<div class="file"><h5>'+esc(p.name)+'</h5><p>'+
         (p.verdict?'<b style="color:var('+(p.cert?'--brand':'--bad')+')">'+esc(VERD[p.verdict])+'</b>'
                   :'لم يُشهد له')+
         (p.graded?' · قُدّرت '+AR(p.pts)+' درجة':'')+
         (p.note?'<br>'+esc(p.note):'')+'</p>';
      if(p.cert&&!p.graded)
        var dv = p.partial ? Math.ceil(m.p/2) : m.p;
        h+='<div class="row"><input type="number" id="gp'+i+'" value="'+dv+'" min="0" max="'+m.p+
           '" style="width:84px"><button class="btn" data-gm="'+oi+'|'+i+'">قدّر</button></div>'+
           (p.partial?'<div class="note">نفّذ جزئيًّا — والتقديرُ للّجنة</div>':'');
      h+='</div>';});
    h+='<label>توصيةُ اللجنة في المحضر</label><textarea id="opN">'+esc(o.note||"")+'</textarea>'+
      '<div class="row"><button class="btn" id="opFin">اعتمد المخطّطَ وقيّد المحضر</button>'+
      '<button class="btn ghost" id="opX">تراجع</button></div>';
    sheet(h);
    document.querySelectorAll("[data-gm]").forEach(function(b){
      b.onclick=function(){ var pr=b.getAttribute("data-gm").split("|");
        var oo=S.opps[parseInt(pr[0],10)], idx=parseInt(pr[1],10);
        var v=parseInt(document.getElementById("gp"+idx).value,10)||0;
        if(v>m.p){flash("لا تتجاوز "+AR(m.p)+" درجات");return;}
        oo.members[idx].graded=true; oo.members[idx].pts=v;
        OLOG(oo,"قُدّرت "+AR(v)+" درجة لـ"+oo.members[idx].name.split(" ")[0],
          "لجنةُ التوجيه الطلابيّ",{d:"١٤٤٨/٥/١٢"});
        if(oo.members[idx].isMe){
          var g=award(v, deducted()>0?"comp":"merit");
          if(g.total<v) flash("قُيّد "+AR(g.total)+" — بلغ المجموعُ سقفَ ١٠٠");
          oo.members[idx].split=g;
        }
        save(); draw(); render(); flash("قُدّرت "+AR(v)+" درجة لـ"+oo.members[idx].name.split(" ")[0]); };});
    document.getElementById("opFin").onclick=function(){
      var n=document.getElementById("opN").value.trim();
      if(!n){flash("اكتب توصيةَ اللجنة");return;}
      var ung=o.members.filter(function(x){return x.cert&&!x.graded;});
      if(ung.length){flash("بقي "+AR(ung.length)+" لم تُقدَّر درجتُهم");return;}
      o.planned=true; o.note=n;
      OLOG(o,"اعتُمد مخطّطُ الفرصة وقُيّد المحضر","لجنةُ التوجيه الطلابيّ",{d:"١٤٤٨/٥/١٢",more:n});
      S.minutes.push({d:"١٤٤٨/٥/١٢",t:"مخطّطُ فرصة — "+m.t,
        dec:"قُدّرت درجاتُ "+AR(o.members.filter(function(x){return x.graded;}).length)+" مشاركًا",note:n});
      save(); closeSheet(); render(); flash("اعتُمد المخطّطُ وقُيّد المحضر"); };
    document.getElementById("opX").onclick=closeSheet;
  }
  draw();
}

      pl.desc=document.getElementById("plD").value.trim();
      pl.signs=document.getElementById("plS").value.trim();
      pl.ante=document.getElementById("plA").value.trim();
      pl.post=document.getElementById("plB").value.trim();
      pl.gain=document.getElementById("plG").value.trim();
      pl.prior=document.getElementById("plP").value.trim();
      pl.target=document.getElementById("plT").value.trim();

        var k=b.getAttribute("data-addrow");

          win:document.getElementById(k+"W").value,
          n:parseInt(document.getElementById(k+"N").value,10)||1});

    if(bT) bT.onclick=function(){ grab(); f.plan=pl; openAskTeachers(S.files.indexOf(f)); };
    document.getElementById("plAuto").onclick=function(){
      grab();
      var sv=f.survey||{neg:[],pos:[],cause:"",plan:""};
      if(!pl.desc) pl.desc="يُكرّر الطالبُ "+PROBLEMS[f.p]+"، وقد رُصد عليه "+AR(f.recs.length)+

      if(!pl.signs) pl.signs = sv.neg.length ? sv.neg.join(" · ") : "لم تُحصر بعد";
      if(!pl.ante) pl.ante= sv.cause || "بانتظار ما يرصده الموجّه من مثيراتٍ قبليّة";
      if(!pl.gain) pl.gain="بانتظار تحليل الموجّه — ما الذي يحقّقه الطالبُ من هذا السلوك";
      if(!pl.post) pl.post="بانتظار تحليل الموجّه — ما يحدث بعد السلوك فيثبّته";
      if(!pl.prior) pl.prior="تنبيهان شفهيّان · حصرُ السلوكيّات · تدوينٌ وتوقيعٌ · حسمُ درجة · اتّصالٌ بوليّ الأمر";
      if(!pl.target) pl.target=WANT[f.p]||"";
      (TX[f.p]||[]).forEach(function(t,i){ if(!pl.tx[i]) pl.tx[i]=t; });
      if(!pl.pre.length){
        f.recs.forEach(function(r){ pl.pre.push({day:"—",win:"اليوم كلّه",n:1}); });
      }
      draw(); flash("جُهّزت المسوّدة — راجعها وأكمل ما تركه النظامُ لك");
    };
    document.getElementById("plSave").onclick=function(){
      grab(); f.plan=pl; save(); closeSheet(); render(); flash("حُفظت مسوّدةُ الخطّة"); };
    document.getElementById("plOk").onclick=function(){
      grab();
      var miss=[];
      if(!pl.desc)miss.push("وصفُ المشكلة");
      if(!pl.signs)miss.push("المظاهرُ السلوكيّة");
      if(!pl.ante)miss.push("المثيراتُ القبليّة");
      if(!pl.post)miss.push("المثيراتُ البعديّة");
      if(!pl.gain)miss.push("ما يحقّقه الطالب");
      if(!pl.target)miss.push("السلوكُ المرغوب إجرائيًّا");
      if(!pl.tx[0])miss.push("الإجراءُ الأوّل");
      if(!pl.pre.length)miss.push("قياسٌ قبل العلاج");
      if(!pl.vDeputy)miss.push("رأيُ الوكيل");
      if(!(pl.teachers||[]).some(function(t){return !!t.op;}))miss.push("رأيُ معلّمٍ واحدٍ على الأقلّ");
      if(miss.length){ flash("لا تُعتمد الخطّةُ بلا: "+miss.join(" · ")); return; }
      pl.final=true; f.plan=pl; f.acts.plan=true;
      LOG(f,"اعتُمدت خطّةُ تعديل السلوك (٣)","سعيد زنبيل — الموجّه","موجّه",
        {d:"١٤٤٨/٥/٣",more:pl.target});
      save(); closeSheet(); render();
      flash("اعتُمدت الخطّةُ — وأُرسلت لوليّ الأمر لرأيه"); };
    document.getElementById("plX").onclick=closeSheet;
  }
  draw();
}

}

     (byTask?'':'<button class="btn soft" id="svAs">كلّف به أحدًا</button>')+
     '<button class="btn ghost" id="svX">تراجع</button></div>';
  sheet(h);
  [["pn","tipN"],["pp","tipP"]].forEach(function(pr){
    var tip=document.getElementById(pr[1]);
    function count(){ return document.getElementById(pr[0]).querySelectorAll("span.on").length; }
    document.getElementById(pr[0]).querySelectorAll("span").forEach(function(s){
      s.onmouseenter=function(){ var d=s.getAttribute("data-d"); if(d&&tip) tip.textContent=d; };
      s.onclick=function(){
        s.classList.toggle("on");
        if(tip) tip.textContent=(s.classList.contains("on")?"✓ ":"")+
          (s.getAttribute("data-d")||s.getAttribute("data-v"))+" · المختار: "+count();
      };});});
  function addItem(inpId,boxId,tipId){
    var inp=document.getElementById(inpId); if(!inp) return false;
    var v=(inp.value||"").trim(); if(!v) return false;
    var box=document.getElementById(boxId);
    var dup=false;
    box.querySelectorAll("span").forEach(function(x){
      if(x.getAttribute("data-v")===v){ x.classList.add("on"); dup=true; }});
    if(!dup){
      var sp=document.createElement("span");
      sp.textContent=v; sp.setAttribute("data-v",v); sp.setAttribute("data-d",v);
      sp.className="on";
      sp.onclick=function(){sp.classList.toggle("on");};
      box.appendChild(sp);
    }
    inp.value="";
    var tip=document.getElementById(tipId);
    if(tip) tip.textContent="✓ أُضيف: "+v+" · المختار: "+box.querySelectorAll("span.on").length;
    return true;
  }
  [["addN","pn","tipN","addNB"],["addP","pp","tipP","addPB"]].forEach(function(pr){
    var inp=document.getElementById(pr[0]), btn=document.getElementById(pr[3]);
    if(btn) btn.onclick=function(ev){ if(ev&&ev.preventDefault)ev.preventDefault();
      if(!addItem(pr[0],pr[1],pr[2])) flash("اكتب شيئًا قبل الإضافة"); };
    if(inp){
      inp.onkeydown=function(ev){ if(ev.key==="Enter"||ev.keyCode===13){
        ev.preventDefault(); addItem(pr[0],pr[1],pr[2]); } };
      inp.onchange=function(){ addItem(pr[0],pr[1],pr[2]); };
    }});
  function grab(){
    addItem("addN","pn","tipN"); addItem("addP","pp","tipP");
    var g=function(id){var o=[];
      document.getElementById(id).querySelectorAll("span.on").forEach(function(s){
        o.push(s.getAttribute("data-v"));});return o;};
    return {neg:g("pn"),pos:g("pp"),cause:document.getElementById("cause").value.trim(),
      plan:document.getElementById("plan").value.trim()};}
  document.getElementById("svOk").onclick=function(){
    var d=grab(); if(!d.neg.length){flash("اختر سلوكًا سلبيًّا واحدًا على الأقلّ");return;}
    if(byTask){ f.taskSurvey=d; if(f.task) f.task.done=true;
      LOG(f,"رفع المكلَّفُ حصرَه",(f.task?f.task.who:"المكلَّف"),"مكلَّف",

      {d:"١٤٤٨/٤/١٦",more:AR(d.neg.length)+" سلبيّةً · "+AR(d.pos.length)+" إيجابيّةً",
       detail:chips(d)});

  document.getElementById("svX").onclick=closeSheet;
}

function badge(id,n){var e=document.getElementById(id);if(!e)return;
  if(n>0){e.textContent=AR(n);e.hidden=false;e.removeAttribute('hidden');}
  else {e.textContent='';e.hidden=true;e.setAttribute('hidden','');}}

function safeView(id,fn,name){
  var el=document.getElementById(id); if(!el) return;
  try{ el.innerHTML=fn(); }
  catch(e){ el.innerHTML='<div class="card"><h3>تعذّر عرضُ '+name+'</h3>'+
    '<p class="meta">خللٌ في العرض — وبقيّةُ الشاشات تعمل</p>'+
    '<div class="note">'+esc(String(e&&e.message||e))+'</div></div>';
    if(window.console) console.error(name,e); }
}

      o.members.push({name:"شادي أحمد راجح الزهراني",isMe:true,cert:false,graded:false,pts:0});
      var others=["نواف سعيد الزهراني","وسام أحمد الزهراني","بدر مساعد الزهراني",
                  "جسّار محمد الزهراني","أحمد سعدي الزهراني"];
      while(o.members.length<o.cap && Math.random()<0.75 && others.length)
        o.members.push({name:others.shift(),isMe:false,cert:false,graded:false,pts:0});
      o.joined=true; o.taken=o.members.length;
      OLOG(o,"سجّل شادي أحمد الزهراني في الفرصة","شادي أحمد الزهراني",
        {more:"المسجَّلون "+AR(o.taken)+" من "+AR(o.cap)});
      if(o.taken>=o.cap){ o.open=false; o.closeWhy="اكتمل العدد";
        OLOG(o,"أُغلقت الفرصة — اكتمل العدد","آليّ"); }
      save(); render();
      flash(o.open?"سُجّلت في الفرصة":"سُجّلت — واكتمل العددُ فأُغلقت");};});
  document.querySelectorAll("[data-cert]").forEach(function(b){
    b.onclick=function(){ var pr=b.getAttribute("data-cert").split("|");
      openCertify(parseInt(pr[0],10), parseInt(pr[1],10), pr[2]||""); };});
  document.querySelectorAll("[data-refer]").forEach(function(b){
    b.onclick=function(){openRefer(parseInt(b.getAttribute("data-refer"),10));};});
  document.querySelectorAll("[data-cmin]").forEach(function(b){
    b.onclick=function(){openCaseMinutes(parseInt(b.getAttribute("data-cmin"),10));};});
  document.querySelectorAll("[data-oplan]").forEach(function(b){
    b.onclick=function(){openOppPlan(parseInt(b.getAttribute("data-oplan"),10));};});
  document.querySelectorAll("[data-close]").forEach(function(b){
    b.onclick=function(){var o=S.opps[parseInt(b.getAttribute("data-close"),10)];
      if(o){o.open=false;o.closeWhy="انتهى الوقت";
        OLOG(o,"أُغلقت الفرصة — انتهى الوقت","لجنةُ التوجيه الطلابيّ");
        save();render();flash("أُغلقت الفرصة — انتهى الوقت");}};});
  document.querySelectorAll("[data-fwd]").forEach(function(b){
    b.onclick=function(){var e=S.evid[parseInt(b.getAttribute("data-fwd"),10)];
      if(e){e.state="forwarded";save();render();flash("رُفع الشاهدُ إلى اللجنة");}};});
  document.querySelectorAll("[data-rej]").forEach(function(b){
    b.onclick=function(){var e=S.evid[parseInt(b.getAttribute("data-rej"),10)];
      if(e){e.state="rejected";save();render();flash("رُدّ الشاهد");}};});
  document.querySelectorAll("[data-kdo]").forEach(function(b){
    b.onclick=function(){cur=parseInt(b.getAttribute("data-kdo"),10);openSurvey(false);};});
  document.querySelectorAll("[data-kback]").forEach(function(b){
    b.onclick=function(){var f=S.files[parseInt(b.getAttribute("data-kback"),10)];
      if(f&&f.task){f.task.done=true;save();render();flash("أُعيدت إلى الوكيل");}};});
  document.querySelectorAll("[data-do]").forEach(function(b){
    b.onclick=function(){ var fi=b.getAttribute("data-fi");
      var f = fi!=null ? S.files[parseInt(fi,10)] : F();
      if(f){ var k=b.getAttribute("data-do"); f.acts[k]=true;
        if(k==="sign") LOG(f,"وقّع الطالبُ على ما دُوّن في سجلّ المشكلات",
          "شادي أحمد الزهراني","طالب",{d:"١٤٤٨/٤/٢٥"});

        save(); render(); } };});
}

var tabs=document.querySelectorAll('nav button'),secs=document.querySelectorAll('section');
tabs.forEach(function(b){b.addEventListener('click',function(){
  tabs.forEach(function(x){x.setAttribute('aria-selected','false');});
  b.setAttribute('aria-selected','true');
  secs.forEach(function(s){s.classList.remove('on');});
  var el=document.getElementById(b.dataset.t); if(el) el.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});});});
document.getElementById("mod").addEventListener("click",function(e){
  if(e.target.id==="mod") closeSheet();});

/* حارسٌ دائمٌ لزرّ التصفير — يعمل ولو تعثّر الربطُ العاديّ */
document.addEventListener("click",function(e){
  var t=e.target; while(t && t.id!=="rst" && t!==document.body) t=t.parentNode;
  if(!t||t.id!=="rst") return;
  e.preventDefault();
  try{ localStorage.removeItem(KEY); }catch(x){}
  S=fresh(); cur=0; flashMsg=null; REC_BY="المعلّم المباشر للموقف";
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(x){}
  closeSheet(); render(); flash("صُفّر كلُّ شيء");
  window.scrollTo({top:0,behavior:"smooth"});
},true);

load(); render();
})();
</script>
