<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤيّد · الموجّه الطلابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1>مؤيّد · الموجّه الطلابي</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr-acts">
    <button id="logout" class="hbtn" type="button">خروج</button>
  </div>
</header>
<nav class="screens" id="screens" aria-label="الشاشات" hidden></nav>
<div class="testmode" id="testMode" hidden></div>
<div class="gatebox"><div class="notice err" id="gateErr" hidden></div></div>

<main id="kView" class="wrap" hidden>
  <p class="hint">🔒 دراسةُ الحالة وجلساتُ المتابعة سرّيّةٌ عند الموجّه — والتقريرُ وحدَه يخرج للّجنة.</p>
  <div class="notice err" id="loadErr" hidden></div>

  <section id="boardView">
    <h2 class="ph">مؤشّرُ متابعة حالات الطلاب</h2>
    <div class="filters" id="fState" role="group" aria-label="الحالة">
      <button type="button" data-s="" aria-pressed="true">الكلّ</button>
      <button type="button" data-s="قيد المعالجة" aria-pressed="false">قيد المعالجة</button>
      <button type="button" data-s="تمّت المعالجة" aria-pressed="false">تمّت المعالجة</button>
    </div>
    <div id="cases"></div>
  </section>

  <section id="caseView" hidden>
    <button type="button" class="back" id="backBoard">← المؤشّر</button>
    <div id="caseBox"></div>
  </section>
</main>

<dialog id="sessDlg"><form method="dialog">
  <h3>جلسةُ متابعة</h3>
  <p class="hint">رقمُ الجلسة يضعه النظام.</p>
  <label for="sOn">تاريخها</label>
  <input id="sOn" type="date">
  <label for="sMin">مدّتها بالدقائق</label>
  <input id="sMin" type="number" min="1" inputmode="numeric">
  <label for="sDisc">ما نُوقش — إلزامي</label>
  <textarea id="sDisc" rows="3"></textarea>
  <label for="sResp">مدى الاستجابة — إلزامي</label>
  <select id="sResp">
    <option value="">— اختر —</option>
    <option value="تحسّنٌ ملحوظ">تحسّنٌ ملحوظ</option>
    <option value="تحسّنٌ طفيف">تحسّنٌ طفيف</option>
    <option value="السلوكُ مستمرّ">السلوكُ مستمرّ</option>
    <option value="تراجُع">تراجُع</option>
  </select>
  <label for="sNext">الخطوةُ التالية — إلزامي</label>
  <textarea id="sNext" rows="2"></textarea>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept" id="sOk" disabled>قيّد الجلسة</button>
  </div>
</form></dialog>

<dialog id="repDlg"><form method="dialog">
  <h3>تقريرُ دراسة الحالة — إلى لجنة التوجيه</h3>
  <div id="repAuto" class="quote"></div>
  <label for="rOpinion">الرأيُ الفنّيّ — إلزامي</label>
  <textarea id="rOpinion" rows="3"></textarea>
  <label for="rRec">التوصية — إلزامي</label>
  <textarea id="rRec" rows="3"></textarea>
  <p class="hint">يُرفع مرّةً واحدة، ويخرج ملخّصاً بلا نصّ الجلسات ولا الدراسة.</p>
  <div class="dlg-acts">
    <button value="cancel" type="submit" class="btn-ghost">تراجع</button>
    <button value="ok" type="submit" class="btn-accept" id="rOk" disabled>ارفع التقرير</button>
  </div>
</form></dialog>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="counsel.js"></script>
</body>
</html>
